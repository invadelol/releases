name: Beta

# Builds a beta tag of the private invadelol/app (v0.3.5-beta.1) like release.yaml, but only the
# signed update packages, and uploads them to invade.lol instead of publishing anything here. Its
# logs are sealed like the release's. invade.lol keeps the packages privately and streams them only
# to beta testers' apps (core docs/desktop-sync.md §8); the build appears as a draft in the admin
# dashboard, which publishes it with its notes.
#
# Beta steps:
#   1. In invadelol/app, set the version to e.g. 0.3.5-beta.1 in package.json,
#      src-tauri/tauri.conf.json, src-tauri/Cargo.toml and src-tauri/Cargo.lock
#      (`node scripts/check-version.mjs`), tag v0.3.5-beta.1 and push the tag.
#   2. gh workflow run beta.yaml -R invadelol/releases -f tag=v0.3.5-beta.1
#   3. Admin → Beta builds → the build: write what to test, then Publish.
#
# Secrets of this repo, on top of release.yaml's:
#   BETA_UPLOAD_SECRET
#     The same value as BETA_UPLOAD_SECRET on invade.lol's server.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Beta tag of invadelol/app, like v0.3.5-beta.1
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  NO_COLOR: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: --bundles nsis
            rust-targets: ''
            target: windows-x86_64
            seal: beta-windows-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app
            rust-targets: aarch64-apple-darwin
            target: darwin-aarch64
            seal: beta-macos-arm64
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app
            rust-targets: x86_64-apple-darwin
            target: darwin-x86_64
            seal: beta-macos-x64
    steps:
      - name: Tag is a beta version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo 'The tag must look like v1.2.3-beta.1.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: invadelol/app
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - name: Tag matches the app version
        working-directory: app
        env:
          TAG: ${{ inputs.tag }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/q.sh" node scripts/check-version.mjs "$TAG"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Install
        working-directory: app
        run: bash "$GITHUB_WORKSPACE/.github/scripts/q.sh" pnpm install --frozen-lockfile
      - name: Build the frontend
        working-directory: app
        run: bash "$GITHUB_WORKSPACE/.github/scripts/q.sh" pnpm build
      - name: Test before packaging
        working-directory: app/src-tauri
        run: bash "$GITHUB_WORKSPACE/.github/scripts/q.sh" cargo test --lib --locked
      - name: Skip the frontend build
        run: echo '{"build":{"beforeBuildCommand":""}}' > "$RUNNER_TEMP/tauri-prebuilt.json"
      # The signed update package only: testers move to a beta through the app's updater.
      - name: Build the signed update package
        working-directory: app
        env:
          RUSTFLAGS: -Awarnings
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGS: ${{ matrix.args }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/q.sh" pnpm tauri build $ARGS --config "$RUNNER_TEMP/tauri-prebuilt.json"
      # invade.lol keeps it privately and serves it only to testers' apps (core, docs/desktop-sync.md §8.6).
      - name: Upload to invade.lol
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          SECRET: ${{ secrets.BETA_UPLOAD_SECRET }}
        run: |
          version="${TAG#v}"
          case "$TARGET" in
            windows-x86_64) file="app/src-tauri/target/release/bundle/nsis/Invade_${version}_x64-setup.exe"; name="Invade_${version}_x64-setup.exe" ;;
            darwin-aarch64) file="app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Invade.app.tar.gz"; name="Invade_aarch64.app.tar.gz" ;;
            darwin-x86_64) file="app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Invade.app.tar.gz"; name="Invade_x64.app.tar.gz" ;;
          esac
          [ -f "$file" ] || { echo "Missing package for $TARGET"; exit 1; }
          [ -f "$file.sig" ] || { echo "Missing signature for $TARGET"; exit 1; }
          [ -n "$SECRET" ] || { echo 'BETA_UPLOAD_SECRET is not set'; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -X PUT \
            "https://invade.lol/api/beta/upload?version=${version}&target=${TARGET}&name=${name}" \
            -H "Authorization: Bearer $SECRET" \
            -H "X-Invade-Signature: $(tr -d '\r\n' < "$file.sig")" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$file")
          echo "Upload $TARGET: HTTP $code"
          [ "$code" = 200 ]
      - name: Seal the log
        if: always()
        env:
          NAME: ${{ matrix.seal }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/seal.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-${{ matrix.seal }}
          path: ${{ runner.temp }}/sealed-${{ matrix.seal }}.enc
          if-no-files-found: ignore
          retention-days: 14
